name: Nightly Fuzz

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen || uv sync
      - name: Run fuzz suites
        run: uv run pytest tests/armor/test_fuzz_parsers.py tests/armor/test_bots.py -q
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures-${{ github.run_id }}
          path: |
            .pytest_cache/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
