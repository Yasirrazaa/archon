name: AI Code Review

# ROADMAP item 62 — PR review bot (Augustus claude-code.yml pattern).
# Posts an automated AI review comment on every pull request.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect diff for review
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > /tmp/pr.diff
          wc -l /tmp/pr.diff

      - name: AI review (Claude)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          PROMPT="Review this diff for security vulnerabilities, correctness bugs, and test gaps. Be concise; flag only real issues with file/line references."
          python3 - <<'PYEOF' > /tmp/review.md
          import json, os, urllib.request
          diff = open('/tmp/pr.diff').read()[:60000]
          body = {
              "model": "claude-sonnet-4-5",
              "max_tokens": 2048,
              "messages": [{"role": "user", "content": f"{os.environ['PROMPT']}\n\n```diff\n{diff}\n```"}],
          }
          req = urllib.request.Request(
              "https://api.anthropic.com/v1/messages",
              data=json.dumps(body).encode(),
              headers={"x-api-key": os.environ["ANTHROPIC_API_KEY"],
                       "anthropic-version": "2023-06-01",
                       "content-type": "application/json"},
          )
          resp = json.load(urllib.request.urlopen(req))
          print("\n".join(b["text"] for b in resp["content"] if b["type"] == "text"))
          PYEOF

      - name: Post review comment
        if: env.ANTHROPIC_API_KEY != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/review.md', 'utf8').trim();
            if (!body) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🤖 AI Code Review\n\n${body}\n\n<sub>automated — informational only</sub>`,
            });
