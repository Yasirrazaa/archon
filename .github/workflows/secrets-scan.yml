name: Secrets Scan

# ROADMAP item 65a — supply-chain hygiene (Augustus secrets-scan pattern).
# Scans the working tree for credential-shaped strings on every push/PR.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        run: |
          python3 - <<'PYEOF'
          import os, re, sys

          # High-signal patterns; keep FP-prone generic patterns out.
          PATTERNS = [
              (re.compile(r"sk-or-v1-[0-9a-f]{32,}"), "OpenRouter key"),
              (re.compile(r"sk-ant-[0-9A-Za-z\-_]{20,}"), "Anthropic key"),
              (re.compile(r"sk-proj-[0-9A-Za-z\-_]{20,}"), "OpenAI project key"),
              (re.compile(r"AIza[0-9A-Za-z\-_]{35}"), "Google API key"),
              (re.compile(r"ghp_[0-9A-Za-z]{36}"), "GitHub PAT"),
              (re.compile(r"-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----"), "private key"),
              (re.compile(r"xox[baprs]-[0-9A-Za-z\-]{10,}"), "Slack token"),
          ]
          SKIP_DIRS = {".git", ".venv", "node_modules", "__pycache__", "site",
                       "augustus", "garak", "promptfoo", "PyRIT", "deepteam",
                       "deepeval", "agentdojo", "agent-scan", "ragas",
                       "Guardrails", "finbot-ctf", "caisi-cyber-evals"}
          ALLOW = ("test_", "tests/", "/tests/", "_test.py", ".example",
                   "dummy", "fake-", "fakes/", "ARCHON-", "example")
          hits = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in SKIP_DIRS]
              for fn in files:
                  path = os.path.join(root, fn)
                  if not os.path.isfile(path) or os.path.getsize(path) > 2_000_000:
                      continue
                  try:
                      text = open(path, encoding="utf-8", errors="ignore").read()
                  except OSError:
                      continue
                  for rx, label in PATTERNS:
                      for m in rx.finditer(text):
                          ctx_start = max(0, m.start() - 40)
                          context = text[ctx_start:m.end() + 10].lower()
                          if any(a.lower() in context for a in ALLOW):
                              continue
                          hits.append(f"{path}: {label}")
          if hits:
              print("POTENTIAL SECRETS FOUND:")
              for h in sorted(set(hits)):
                  print(f"  - {h}")
              sys.exit(1)
          print("no secrets detected")
          PYEOF
