name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen || uv sync
      - name: Ruff lint
        run: uv run ruff check packages/ src/ tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --frozen || uv sync
      - name: Run tests with coverage gate (minimum 85%)
        run: uv run pytest --cov=packages --cov-report=term-missing --cov-fail-under=85 -q

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: armor
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: armor
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen || uv sync
      - name: Postgres registry integration tests
        env:
          ARCHON_TEST_DATABASE_URL: postgresql://armor:pass@localhost:5432/armor
        run: uv run pytest tests/armor/test_postgres_registry.py -q
