[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentbeats-security-arena"
version = "0.1.0"
description = "Adversarial AI agent security testing framework for the Lambda × Berkeley RDI AgentBeats Competition"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["ai-security", "adversarial-testing", "prompt-injection", "agent-security", "llm-security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "a2a-sdk>=0.3.5",
    "google-adk>=1.14.1",
    "google-genai>=1.36.0",
    "jinja2>=3.1.0",
    "openai>=2.8.1",
    "pydantic>=2.11.9",
    "python-dotenv>=1.1.1",
    "uvicorn>=0.35.0",
]

[project.scripts]
agentbeats-run = "agentbeats.run_scenario:main"
archon = "archon_cli.main:main"

[project.optional-dependencies]
otel = [
    "opentelemetry-sdk>=1.37.0",
    "opentelemetry-exporter-otlp-proto-http>=1.37.0",
]
postgres = [
    "psycopg[binary]>=3.3",
]

[tool.uv]
package = true
dev-dependencies = [
    "mypy>=1.18.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "psycopg[binary]>=3.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentbeats", "packages/archon_core", "packages/archon_armor", "packages/archon_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
pythonpath = ["packages"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring external services",
]

[dependency-groups]
bench = [
    "deepdiff>=9.1.0",
    "email-validator>=2.3.0",
]
